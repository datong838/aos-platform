apiVersion: aos.dev/v1alpha1
kind: DomainPack
metadata:
  id: domain.ecommerce.core
  version: 1.4.0
  displayName: 电商核心本体包
  publisher: aos
  license: internal
spec:
  platformApi: ">=1.7.0 <2.0.0"
  runtime:
    apiVersion: aos.dev/bundle-runtime/v1alpha1
    backend:
      entrypoint: backend/ecommerce_core/__init__.py:register
      pythonPackage: ecommerce_core
      schemaNamespace: ecommerce_core
      profileId: internal-python-v1
      imageIndex: artifacts/runtime-image-index.json
  dependencies: []
  optionalDependencies: []
  conflicts: []
  exports:
    ontology:
      - content/ontology/
    schemas:
      - content/schemas/
    policies:
      - content/policies/
  capabilities:
    provides: []
    requires: []
  permissions:
    roles: []
    markings: []
    dataScopes: []
    actionTypes: []
  migrations:
    plan: null
    downgradePolicy: retain-canonical
  preflight: null
  regression: null
  rollback: null
  contributions:
    - kind: api
      operationId: ecommerce_core_product_event_windows
      method: POST
      path: /ecommerce/core/events/windows
      mode: exclusive
    - kind: api
      operationId: ecommerce_core_object_describe
      method: POST
      path: /ecommerce/core/objects/describe
      mode: exclusive
