apiVersion: aos.dev/v1alpha1
kind: PlatformAdapterPack
metadata:
  id: platform.ecommerce.niushop
  version: 1.6.0
  displayName: Niushop 微商城平台适配包
  publisher: aos
  license: internal
spec:
  platformApi: ">=1.7.0 <2.0.0"
  runtime:
    apiVersion: aos.dev/bundle-runtime/v1alpha1
    backend:
      entrypoint: backend/ecommerce_niushop/__init__.py:register
      pythonPackage: ecommerce_niushop
      schemaNamespace: ecommerce_niushop
      profileId: internal-python-v1
      imageIndex: artifacts/runtime-image-index.json
  dependencies:
    - publisher: aos
      id: domain.ecommerce.core
      version: ">=1.2.0 <2.0.0"
  optionalDependencies: []
  conflicts: []
  exports:
    connectors:
      - content/connectors/
    schemas:
      - content/schemas/
    mappings:
      - content/mappings/
    policies:
      - content/policies/
  capabilities:
    provides: []
    requires: []
  permissions:
    roles: []
    markings: []
    dataScopes: []
    actionTypes: []
  migrations:
    plan: null
    downgradePolicy: retain-canonical
  preflight: null
  regression: null
  rollback: null
  contributions:
    - kind: api
      operationId: ecommerce_niushop_source_describe
      method: POST
      path: /ecommerce/niushop/source/describe
      mode: exclusive
    - kind: api
      operationId: ecommerce_niushop_facts_read
      method: POST
      path: /ecommerce/niushop/facts/read
      mode: exclusive
