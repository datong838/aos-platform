pipeline_id: P09
source_table: ns_weapp
target_ot: Weapp
primary_key: weapp_id
site_filter: "site_id=1"
incremental_strategy: snapshot
incremental_cursor:
  fields: [modify_time]
  fallback: create_time
  mode: snapshot
unique_key_pattern: "niushop:{site_id}:{pk}"
validation:
  required: [weapp_name]
field_mappings:
  - {source: weapp_id, target: id, type: int}
  - {source: site_id, target: siteId, type: int}
  - {source: weapp_name, target: name, type: string}
  - {source: appid, target: appId, type: string}
  - {source: weapp_original, target: originalId, type: string}
  - {source: qrcode, target: qrCode, type: string}
  - {source: status, target: status, type: int}
  - {source: is_default, target: isDefault, type: int}
  - {source: create_time, target: createTime, type: timestamp}
  - {source: modify_time, target: modifyTime, type: timestamp}
pii_exclusion:
  - appsecret
  - token
  - encodingaeskey
notes:
  - "ns_weapp 表共 13 个字段，小程序配置信息"
  - "字段映射 10 个：标识(3)+小程序配置(4)+状态(2)+时间(2)"
  - "PII 排除 3 个：appsecret/token/encodingaeskey（密钥类敏感信息）"
