# Niushop 统一 PII 排除清单（按表分组）
# 权威来源：frozen/01-schema-fingerprint.md §2 PII 字段分类汇总 + frozen/02-pipeline-manifest.yaml P08
# 约束(frozen/01 L6): 只聚合不取值；PII_DIRECT 字段不出库；PII_QUASI 按需脱敏
version: 1
source_ref:
  frozen_01: "docs/palantier/20_tech/电商平台接入/微商城电商接入方案/frozen/01-schema-fingerprint.md#L551"
  frozen_02: "docs/palantier/20_tech/电商平台接入/微商城电商接入方案/frozen/02-pipeline-manifest.yaml#L129"
policy:
  pii_direct: drop            # 直接丢弃，不投影到 OT
  pii_quasi: drop_or_mask     # 默认丢弃，需保留时由 Project 节点脱敏
tables:
  ns_site:
    pii_direct: [site_tel]
    pii_quasi: []
  ns_goods:
    pii_direct: []
    pii_quasi: []
  ns_goods_sku:
    pii_direct: []
    pii_quasi: []
  ns_goods_category:
    pii_direct: []
    pii_quasi: []
  ns_order:
    pii_direct: [mobile, telephone, address, full_address, invoice_full_address]
    pii_quasi: [invoice_email]
  ns_order_goods:
    pii_direct: [refund_address, refund_address_id]
    pii_quasi: []
  ns_express_delivery_package:
    pii_direct: []
    pii_quasi: []
    sensitive_mask: [delivery_no]   # 物流号按敏感级别遮罩（非 PII，但需 masking）
  ns_member:
    pii_direct: [mobile, wx_openid, nickname, avatar, reg_address, last_login_ip, password, pay_password]
    pii_quasi: []
    note: "frozen/02 P08 隐私最小化 8 字段排除清单（D1.5 落地）"
# Project 节点全局 drop 清单（跨表去重并集）
global_drop_on_project_node:
  - mobile
  - telephone
  - address
  - full_address
  - invoice_full_address
  - invoice_email
  - refund_address
  - refund_address_id
  - site_tel
  - wx_openid
  - nickname
  - avatar
  - reg_address
  - last_login_ip
  - password
  - pay_password
