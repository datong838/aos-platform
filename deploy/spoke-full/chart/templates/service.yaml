apiVersion: v1
kind: Service
metadata:
  name: {{ include "aos-spoke-full.fullname" . }}
  labels:
    {{- include "aos-spoke-full.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "aos-spoke-full.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
