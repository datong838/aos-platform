[project]
name = "aos-extension-sdk"
version = "0.1.0"
requires-python = ">=3.11"
description = "Registration-only AOS isolated extension SDK"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aos_extension_sdk*"]
