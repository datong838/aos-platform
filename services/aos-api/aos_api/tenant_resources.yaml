  - {<<: *owned, name: wiki_page_version, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}

  # Non-table resources must follow the same tenant boundary and clear lifecycle.
