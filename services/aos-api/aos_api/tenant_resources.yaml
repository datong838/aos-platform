  - {<<: *owned, name: twa_audit, baselineScope: CONTROL_PLANE, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-1}
