  - {<<: *owned, name: module_variable, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
  - {<<: *owned, name: module_widget_instance, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}

  # OAuth, branches, objects and pipeline runtime
