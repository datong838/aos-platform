  - {name: tenant-vector-records, kind: vector_records, classification: TENANT_OWNED, owner: knowledge-platform, targetTenantColumns: [org_id, project_id], currentState: N/A, migrationWave: TI-4}
  - {name: tenant-cache-namespaces, kind: cache_namespace, classification: TENANT_OWNED, owner: platform-runtime, targetTenantColumns: [org_id, project_id], currentState: N/A, migrationWave: TI-4}
  - {name: tenant-offline-storage, kind: offline_storage, classification: TENANT_OWNED, owner: data-platform, targetTenantColumns: [org_id, project_id], currentState: N/A, migrationWave: TI-4}
  - {name: tenant-message-queues, kind: message_queue, classification: TENANT_OWNED, owner: platform-runtime, targetTenantColumns: [org_id, project_id], currentState: N/A, migrationWave: TI-4}
  - {name: tenant-scheduler-jobs, kind: scheduler_jobs, classification: TENANT_OWNED, owner: platform-runtime, targetTenantColumns: [org_id, project_id], currentState: N/A, migrationWave: TI-4}
  - {name: tenant-process-memory, kind: process_memory, classification: TENANT_OWNED, owner: agent-runtime, targetTenantColumns: [org_id, project_id], currentState: N/A, migrationWave: TI-4}
