  - {<<: *owned, name: phase5_pipeline_graph, tenantColumns: [], primaryKey: [pipeline_id], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: provider_health, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
