schemaVersion: aos.dev/tenant-resources/v1alpha1
registryVersion: 2
description: TI-0B current-state inventory and target tenant-isolation classification.
canonicalTenantColumns: [org_id, project_id]

# TI-0E is the only executable wave/Worker mapping. Per-resource migrationWave below
# remains the TI-0D historical discovery hint and must not drive implementation.
executionPlan:
  planVersion: 1
  authorization: PLAN_ONLY
  groups:
    - id: ti1-authority-directory
      wave: TI-1
      worker: W1
      dependsOn: []
      resources: [alembic_version, meta_org, twa_org, twa_otp, twa_person_profile]
    - id: ti1-tenant-scope
      wave: TI-1
      worker: W1
      dependsOn: [ti1-authority-directory]
      resources: [meta_membership, meta_workspace, twa_audit, twa_invite, twa_join_request, twa_workspace, twa_ws_member]
    - id: ti1-authorization
      wave: TI-1
      worker: W1
      dependsOn: [ti1-tenant-scope]
      resources: [authz_tuple]

    - id: ti2-asset-templates
      wave: TI-2
      worker: W2
      dependsOn: [ti1-authorization]
      resources: [asset_bundle, asset_bundle_artifact, asset_bundle_dependency, asset_bundle_evidence, asset_bundle_version, asset_bundle_version_event]
    - id: ti2-installations
      wave: TI-2
      worker: W2
      dependsOn: [ti2-asset-templates]
      resources: [bundle_composition, bundle_composition_lock, bundle_installation, bundle_installation_command, bundle_installation_decision, bundle_installation_event, bundle_installation_revision]
    - id: ti2-integration-instances
      wave: TI-2
      worker: W2
      dependsOn: [ti2-installations]
      resources: [integration_case, integration_case_command, integration_case_projection, integration_evidence, integration_evidence_snapshot, integration_instance, integration_instance_revision, integration_stage_event]
    - id: ti2-module-instances
      wave: TI-2
      worker: W2
      dependsOn: [ti1-authorization, ti2-asset-templates]
      resources: [meta_module, module_canvas_config, module_deployment, module_events, module_interface, module_query, module_variable, module_widget_instance, theme, widget_catalog]

    - id: ti3-ontology-templates
      wave: TI-3
      worker: W3
      dependsOn: [ti1-authorization]
      resources: [meta_action_type, meta_link_type, meta_object_type]
    - id: ti3-object-graph
      wave: TI-3
      worker: W3
      dependsOn: [ti3-ontology-templates]
      resources: [funnel_status, graph_edge, meta_branch, obj_branch_overlay, obj_instance, object_lifecycle]
    - id: ti3-draft-wiki
      wave: TI-3
      worker: W3
      dependsOn: [ti3-object-graph]
      resources: [draft_dataset, wiki_page, wiki_page_version]

    - id: ti4-connectors
      wave: TI-4
      worker: W4
      dependsOn: [ti1-authorization]
      resources: [ecom_ingest_receipt, ecom_link, ecom_object, ecom_sync_checkpoint, oauth_token_store]
    - id: ti4-data-os
      wave: TI-4
      worker: W4
      dependsOn: [ti4-connectors]
      resources: [meta_source, meta_pipeline, meta_dataset, meta_dataset_history, meta_sync, meta_schedule, phase5_pipeline_graph]
    - id: ti4-async-runtime
      wave: TI-4
      worker: W4
      dependsOn: [ti1-tenant-scope]
      resources: [apollo_channel, apollo_spoke, tenant-scheduler-jobs]

    - id: ti5-aip
      wave: TI-5
      worker: W4
      dependsOn: [ti3-object-graph, ti4-data-os]
      resources: [aip_eval_report, aip_eval_suite, aip_logic_graph, aip_logic_graph_revision, aip_logic_graph_run_nodes, aip_logic_graph_runs, aip_logic_publication, meta_aip_kv]
    - id: ti5-analytics-models
      wave: TI-5
      worker: W4
      dependsOn: [ti5-aip]
      resources: [capacity_limits, capacity_usage, decision_lineage, model_catalog, model_provider, model_route, provider_health, registered_models]
    - id: ti5-non-postgres
      wave: TI-5
      worker: W4
      dependsOn: [ti5-analytics-models]
      resources: [tenant-object-prefixes, tenant-vector-records, tenant-cache-namespaces, tenant-offline-storage, tenant-message-queues, tenant-process-memory]

x-owned: &owned
  kind: postgres_table
  classification: TENANT_OWNED
  owner: aos-platform
  rlsRequired: true
  clearOrder: 100
  migrationWave: TI-1
x-template: &template
  kind: postgres_table
  classification: PLATFORM_TEMPLATE
  owner: asset-control
  rlsRequired: false
  migrationWave: TI-4
x-global: &global
  kind: postgres_table
  classification: SYSTEM_GLOBAL
  owner: platform-control
  rlsRequired: false
  migrationWave: TI-5

resources:
  # AIP execution and publication
  - {<<: *owned, name: aip_eval_report, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, report_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: aip_eval_suite, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, suite_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: aip_logic_graph, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, graph_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: aip_logic_graph_revision, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, graph_id, revision], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: aip_logic_graph_run_nodes, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, graph_id, run_id, node_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: aip_logic_graph_runs, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, graph_id, run_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: aip_logic_publication, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, publication_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}

  # Platform control, asset templates and installation instances
  - {<<: *global, name: alembic_version, tenantColumns: [], primaryKey: [version_num], currentState: NO_TENANT}
  - {<<: *global, name: apollo_channel, tenantColumns: [], primaryKey: [id], currentState: NO_TENANT}
  - {<<: *owned, name: apollo_spoke, tenantColumns: [org_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
  - {<<: *template, name: asset_bundle, tenantColumns: [], primaryKey: [bundle_pk], currentState: NO_TENANT}
  - {<<: *template, name: asset_bundle_artifact, tenantColumns: [], primaryKey: [version_pk, relative_path], currentState: NO_TENANT}
  - {<<: *template, name: asset_bundle_dependency, tenantColumns: [], primaryKey: [version_pk, optional, ordinal], currentState: NO_TENANT}
  - {<<: *template, name: asset_bundle_evidence, tenantColumns: [], primaryKey: [version_pk, evidence_type, artifact_ref], currentState: NO_TENANT}
  - {<<: *template, name: asset_bundle_version, tenantColumns: [], primaryKey: [version_pk], currentState: NO_TENANT}
  - {<<: *template, name: asset_bundle_version_event, tenantColumns: [], primaryKey: [event_pk], currentState: NO_TENANT}
  - {<<: *owned, name: authz_tuple, tenantColumns: [org_id, project_id], primaryKey: [user_key, relation, object_key], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-1}
  - {<<: *owned, name: bundle_composition, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, composition_pk], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: bundle_composition_lock, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, composition_pk, revision], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: bundle_installation, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, installation_pk], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: bundle_installation_command, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, operation, idempotency_key], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: bundle_installation_decision, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, decision_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: bundle_installation_event, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, installation_pk, sequence], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: bundle_installation_revision, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, installation_pk, revision], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}

  # Capacity, drafts and cross-object lineage
  - {<<: *owned, name: capacity_limits, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
  - {<<: *owned, name: capacity_usage, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
  - {<<: *owned, name: decision_lineage, tenantColumns: [], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: draft_dataset, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}

  # E-commerce connector data; workspace_id is the e-commerce project alias.
  - {<<: *owned, name: ecom_ingest_receipt, owner: ecom-connector, tenantColumns: [org_id, workspace_id], primaryKey: [org_id, workspace_id, platform, shop_or_marketplace_id, stream, idempotency_key], targetTenantColumns: [org_id, workspace_id], canonicalProjectAlias: workspace_id, currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: ecom_link, owner: ecom-connector, tenantColumns: [org_id, workspace_id], primaryKey: [org_id, workspace_id, link_type, source_platform, source_shop_or_marketplace_id, source_object_type, source_external_id, target_platform, target_shop_or_marketplace_id, target_object_type, target_external_id], targetTenantColumns: [org_id, workspace_id], canonicalProjectAlias: workspace_id, currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: ecom_object, owner: ecom-connector, tenantColumns: [org_id, workspace_id], primaryKey: [org_id, workspace_id, platform, shop_or_marketplace_id, object_type, external_id], targetTenantColumns: [org_id, workspace_id], canonicalProjectAlias: workspace_id, currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: ecom_sync_checkpoint, owner: ecom-connector, tenantColumns: [org_id, workspace_id], primaryKey: [org_id, workspace_id, platform, shop_or_marketplace_id, stream], targetTenantColumns: [org_id, workspace_id], canonicalProjectAlias: workspace_id, currentState: STRONG_PK, migrationWave: TI-2}

  # Object model and integration evidence
  - {<<: *owned, name: funnel_status, tenantColumns: [], primaryKey: [object_type], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: graph_edge, tenantColumns: [], primaryKey: [src_type, src_id, rel, dst_type, dst_id], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: integration_case, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, case_pk], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: integration_case_command, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, operation, idempotency_key], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: integration_case_projection, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, case_pk], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: integration_evidence, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, evidence_pk, revision], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: integration_evidence_snapshot, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, case_pk, snapshot_revision], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: integration_instance, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, instance_pk], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: integration_instance_revision, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, instance_pk, revision], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}
  - {<<: *owned, name: integration_stage_event, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, case_pk, sequence], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-2}

  # Metadata: catalog definitions remain templates; instances and overlays are tenant-owned.
  - {<<: *template, name: meta_action_type, tenantColumns: [], primaryKey: [id], currentState: NO_TENANT}
  - {<<: *owned, name: meta_aip_kv, tenantColumns: [], primaryKey: [key], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: meta_branch, tenantColumns: [], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: meta_dataset, tenantColumns: [], primaryKey: [rid], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: meta_dataset_history, tenantColumns: [], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *template, name: meta_link_type, tenantColumns: [], primaryKey: [id], currentState: NO_TENANT}
  - {<<: *owned, name: meta_membership, baselineScope: CONTROL_PLANE, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id, subject], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-1}
  - {<<: *owned, name: meta_module, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
  - {<<: *template, name: meta_object_type, tenantColumns: [], primaryKey: [id], currentState: NO_TENANT}
  - {<<: *global, name: meta_org, tenantColumns: [], primaryKey: [id], currentState: NO_TENANT}
  - {<<: *owned, name: meta_pipeline, tenantColumns: [], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: meta_schedule, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
  - {<<: *owned, name: meta_source, tenantColumns: [org_id, project_id], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: WEAK_PK, migrationWave: TI-3}
  - {<<: *owned, name: meta_sync, tenantColumns: [], primaryKey: [id], targetTenantColumns: [org_id, project_id], currentState: NO_TENANT, migrationWave: TI-3}
  - {<<: *owned, name: meta_workspace, baselineScope: CONTROL_PLANE, tenantColumns: [org_id, project_id], primaryKey: [org_id, project_id], targetTenantColumns: [org_id, project_id], currentState: STRONG_PK, migrationWave: TI-1}

  # Models and organization-specific application/module instances
